[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-taint-path"
version = "0.2.0"
description = "Finds the AI agents, MCP servers and knowledge bases on a network, then ranks the attack paths that run through them to crown-jewel assets."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=2.5"]
dev = ["pytest>=8", "jsonschema>=4.18", "pyyaml>=6"]

[project.scripts]
ai-taint-path = "ai_taint_path.cli:main"

[tool.setuptools.packages.find]
include = ["ai_taint_path*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
